name: Enrich AI Tools Data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Prevent indefinite runs

    steps:
      - name: Checkout enrichment repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install exa-py==2.17.0 google-genai==2.17.0 python-dotenv==1.2.2 requests==2.34.2

      - name: Run enrichment
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: exa
        run: python main.py

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: QAInsights/awesome-ai-tools
          path: target-repo
          token: ${{ secrets.TARGET_REPO_PAT }}

      - name: Copy enriched data
        run: |
          mkdir -p target-repo/public/data
          cp enriched_data.json target-repo/public/data/enriched-tools.json

      - name: Commit and push
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/enriched-tools.json
          git diff --cached --quiet || git commit -m "chore: update enriched data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
